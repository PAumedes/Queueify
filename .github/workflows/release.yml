# Publishes a GitHub release for a tag created by tools/release.ps1, with the portable exe and the
# notes from CHANGELOG.md. Tags with a pre-release suffix (v1.2.0-rc.1) become pre-releases.
name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props', '**/Directory.Build.props', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Tag matches the project version
        shell: pwsh
        run: |
          $version = ([xml](Get-Content Queueify/Queueify.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if ("v$version" -ne $env:GITHUB_REF_NAME) { throw "Tag $env:GITHUB_REF_NAME doesn't match the project version $version" }

      # Before the long steps: a tag without a CHANGELOG section fails here, in seconds.
      - name: Release notes
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force notes | Out-Null
          tools/release.ps1 -Notes $env:GITHUB_REF_NAME | Set-Content -Encoding utf8NoBOM notes/release-notes.md

      - name: Release tool tests
        shell: powershell
        run: tests/tools/Release.Tests.ps1

      - name: Start the Firestore emulator
        shell: pwsh
        run: tools/firestore-emulator.ps1 -Background

      - name: Unit tests
        shell: pwsh
        env:
          QUEUEIFY_FIRESTORE_EMULATOR: 127.0.0.1:8080
        run: dotnet test --project Queueify.Tests --report-xunit-trx --results-directory "$env:GITHUB_WORKSPACE/TestResults/unit"

      - name: Web tests
        shell: pwsh
        run: dotnet test --project Queueify.Web.Tests --report-xunit-trx --results-directory "$env:GITHUB_WORKSPACE/TestResults/web"

      - name: Publish the web app
        shell: pwsh
        run: dotnet publish Queueify.Web -c Release -o "$env:RUNNER_TEMP/web-publish"

      - name: Build the portable app
        shell: pwsh
        run: tools/package.ps1

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: |
            dist/*.exe
            notes/release-notes.md
          if-no-files-found: error

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: test-results
          path: TestResults/
          if-no-files-found: ignore

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: release

      - name: Create the GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          [[ $GITHUB_REF_NAME == *-* ]] && prerelease=(--prerelease)
          gh release create "$GITHUB_REF_NAME" release/dist/*.exe \
            --repo "$GITHUB_REPOSITORY" \
            --title "Queueify $GITHUB_REF_NAME" \
            --notes-file release/notes/release-notes.md \
            --verify-tag "${prerelease[@]}"
